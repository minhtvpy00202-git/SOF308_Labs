<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 1 - Làm quen cơ bản với sự kiện và binding động</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="app">
        <template>
            <div class="p-5">
                <p>{{ message }}</p>
                <button class="btn btn-dark" @click="updateMessage">Thay đổi thông điệp</button>
            </div>
        </template>
    </div>

    <script type="module">
        import { createApp, ref } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';

        createApp({
            setup() {
                const message = ref('Thông điệp ban đầu');
                
                const updateMessage = () => {
                    message.value = 'Thông điệp đã được thay đổi!';
                };

                return {
                    message,
                    updateMessage
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
